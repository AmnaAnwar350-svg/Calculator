<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="./calculater.css" rel="stylesheet" />
</head>
<body>
    <div>
        <h1>Welcome to Calculator</h1>
    </div>
    <div class="main">
        <div class="cal">
            <input type="number" name="cal" class="one"/>
        <div class="two">
            <p>
                <button class="green">AC</button>
                <button class="green">DEL</button>
                <button class="green">%</button>
                <button class="green">/</button>
            </p>
            <p>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="green">*</button>
            </p>
            <p>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="green">-</button>
            </p>
            <p>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="green">+</button>
            </p>
            <p>
                <button>00</button>
                <button>0</button>
                <button>.</button>
                <button class="orange">=</button>
            </p>
        </div>
        </div>
    </div>
</body>
</html>
